@if (loading) {
  <app-spinner message="Cargando links..." [fullscreen]="true"></app-spinner>
}
<div
  class="container"
  [class.dark]="theme.isDark()"
  [class.light]="!theme.isDark()"
>
  @for (link of links; track link) {
    <div class="card">
      <div class="link-text">
        <h3>{{ link.nombre }}</h3>
        @for (tag of link.tags.split(","); track tag) {
          <p>• {{ tag }}</p>
        }
        <a [href]="link.url" target="_blank">Website</a>
      </div>
      <div class="link-logo">
        <img [src]="link.icono" alt="{{ link.nombre }} logo" />
      </div>
    </div>
  }
</div>
