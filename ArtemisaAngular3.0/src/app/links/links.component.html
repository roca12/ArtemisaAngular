<div
  class="container"
  [class.dark]="theme.isDark()"
  [class.light]="!theme.isDark()"
>
  <div class="card" *ngFor="let link of links">
    <div class="link-text">
      <h3>{{ link.nombre }}</h3>
      <p *ngFor="let tag of link.tags.split(',')">• {{ tag }}</p>

      <a [href]="link.url" target="_blank">Website</a>
    </div>
    <div class="link-logo">
      <img [src]="link.icono" alt="{{ link.nombre }} logo" />
    </div>
  </div>
</div>
