<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>ArtemisaAngular30</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/png" href="assets/images/favicon.png" />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/icon?family=Material+Icons"
      rel="stylesheet"
    />

    <style>
      /* ── Reset mínimo para el splash ── */
      #app-splash *,
      #app-splash *::before,
      #app-splash *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      /* ── Contenedor principal ── */
      #app-splash {
        position: fixed;
        inset: 0;
        background: #1e1e1e;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        z-index: 99999;
        gap: 2.5rem;
        transition:
          opacity 0.8s ease,
          visibility 0.8s ease;
        font-family: "Roboto", sans-serif;
        overflow: hidden;
      }

      #app-splash.splash-hidden {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }

      /* ── Partículas de fondo ── */
      #splash-particles {
        position: absolute;
        inset: 0;
        pointer-events: none;
      }

      .splash-particle {
        position: absolute;
        border-radius: 50%;
        opacity: 0;
        animation: splashFloatUp linear infinite;
      }

      @keyframes splashFloatUp {
        0% {
          opacity: 0;
          transform: translateY(0) scale(1);
        }
        10% {
          opacity: 0.4;
        }
        90% {
          opacity: 0.1;
        }
        100% {
          opacity: 0;
          transform: translateY(-90vh) scale(0.3);
        }
      }

      /* ── Logo (plumas + texto) ── */
      .splash-logo-wrap {
        display: flex;
        align-items: center;
        gap: 1.5rem;
        opacity: 0;
        transform: translateY(24px);
        animation: splashFadeUp 0.7s cubic-bezier(0.22, 1, 0.36, 1) 0.2s
          forwards;
      }

      .splash-feather-icon {
        width: 72px;
        height: 72px;
        flex-shrink: 0;
      }

      /* Plumas con pop escalonado */
      .sp-f1 {
        animation: splashFeatherPop 0.5s cubic-bezier(0.22, 1, 0.36, 1) 0.25s
          both;
      }
      .sp-f2 {
        animation: splashFeatherPop 0.5s cubic-bezier(0.22, 1, 0.36, 1) 0.38s
          both;
      }
      .sp-f3 {
        animation: splashFeatherPop 0.5s cubic-bezier(0.22, 1, 0.36, 1) 0.51s
          both;
      }
      .sp-f4 {
        animation: splashFeatherPop 0.5s cubic-bezier(0.22, 1, 0.36, 1) 0.64s
          both;
      }
      .sp-f5 {
        animation: splashFeatherPop 0.5s cubic-bezier(0.22, 1, 0.36, 1) 0.77s
          both;
      }

      @keyframes splashFeatherPop {
        from {
          opacity: 0;
          transform: scale(0.5) translateY(10px);
        }
        to {
          opacity: 1;
          transform: scale(1) translateY(0);
        }
      }

      /* ── Texto del logo ── */
      .splash-logo-text {
        display: flex;
        flex-direction: column;
        line-height: 1;
        gap: 2px;
      }

      .splash-logo-line {
        font-size: 2rem;
        font-weight: 700;
        letter-spacing: 0.12em;
        color: #f0f0f0;
      }

      .splash-logo-line2 {
        display: flex;
        align-items: center;
      }

      .splash-big-a {
        font-size: 2.8rem;
        font-weight: 900;
        color: #ef6024;
        line-height: 0.85;
        margin-left: 2px;
      }

      .splash-divider {
        width: 100%;
        height: 2px;
        background: linear-gradient(90deg, #196774, #ef6024);
        margin: 4px 0;
        opacity: 0;
        transform: scaleX(0);
        transform-origin: left;
        animation: splashGrowLine 0.6s ease 0.7s forwards;
      }

      /* ── Barra de progreso ── */
      .splash-progress-wrap {
        width: 260px;
        opacity: 0;
        animation: splashFadeIn 0.5s ease 0.9s forwards;
      }

      .splash-progress-track {
        width: 100%;
        height: 3px;
        background: #303030;
        border-radius: 99px;
        overflow: hidden;
      }

      .splash-progress-bar {
        height: 100%;
        width: 0%;
        border-radius: 99px;
        background: linear-gradient(90deg, #196774 0%, #ef6024 100%);
        animation: splashLoadBar 2.4s cubic-bezier(0.4, 0, 0.2, 1) 1.1s forwards;
      }

      .splash-progress-label {
        margin-top: 10px;
        font-size: 12px;
        letter-spacing: 0.14em;
        color: #b0b0b0;
        text-align: center;
        text-transform: uppercase;
      }

      /* ── Puntos parpadeantes ── */
      .splash-dots span {
        color: #ef6024;
        animation: splashBlink 1.2s infinite;
      }
      .splash-dots span:nth-child(2) {
        animation-delay: 0.2s;
      }
      .splash-dots span:nth-child(3) {
        animation-delay: 0.4s;
      }

      /* ── Keyframes generales ── */
      @keyframes splashFadeUp {
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      @keyframes splashFadeIn {
        to {
          opacity: 1;
        }
      }

      @keyframes splashGrowLine {
        to {
          opacity: 1;
          transform: scaleX(1);
        }
      }

      @keyframes splashLoadBar {
        0% {
          width: 0%;
        }
        30% {
          width: 35%;
        }
        60% {
          width: 65%;
        }
        85% {
          width: 88%;
        }
        100% {
          width: 100%;
        }
      }

      @keyframes splashBlink {
        0%,
        80%,
        100% {
          opacity: 0.2;
        }
        40% {
          opacity: 1;
        }
      }
    </style>
  </head>

  <body class="mat-typography">
    <!-- ══════════════════════════════════════════
     SPLASH SCREEN
     Se oculta automáticamente cuando Angular
     termina de renderizar (ver app.component.ts)
══════════════════════════════════════════ -->
    <div
      id="app-splash"
      aria-label="Cargando Biblioteca Artemisa"
      role="status"
    >
      <!-- Partículas de fondo -->
      <div id="splash-particles"></div>

      <!-- Logo -->
      <div class="splash-logo-wrap">
        <!-- Icono plumas (recrea el logo Artemisa) -->
        <svg
          class="splash-feather-icon"
          viewBox="0 0 80 90"
          fill="none"
          xmlns="http://www.w3.org/2000/svg"
          aria-hidden="true"
        >
          <path
            class="sp-f5"
            d="M10 80 Q14 50 22 30 Q26 20 30 18 Q24 42 20 65 Z"
            fill="#196774"
            opacity="0.85"
          />
          <path
            class="sp-f4"
            d="M16 78 Q22 48 32 28 Q36 18 40 16 Q34 40 28 63 Z"
            fill="#90A19D"
            opacity="0.75"
          />
          <path
            class="sp-f3"
            d="M24 76 Q32 46 42 26 Q46 16 50 14 Q44 38 38 61 Z"
            fill="#c08c4a"
            opacity="0.85"
          />
          <path
            class="sp-f2"
            d="M34 74 Q42 44 52 24 Q56 14 60 12 Q54 36 48 59 Z"
            fill="#d95c00"
            opacity="0.9"
          />
          <path
            class="sp-f1"
            d="M44 72 Q52 42 62 22 Q66 12 70 10 Q64 34 58 57 Z"
            fill="#EF6024"
            opacity="1"
          />
        </svg>

        <!-- Texto -->
        <div class="splash-logo-text">
          <span class="splash-logo-line">BIBLIOTEC</span>
          <div class="splash-divider"></div>
          <div class="splash-logo-line splash-logo-line2">
            ARTEMIS<span class="splash-big-a">A</span>
          </div>
        </div>
      </div>

      <!-- Barra de progreso -->
      <div class="splash-progress-wrap">
        <div class="splash-progress-track">
          <div class="splash-progress-bar"></div>
        </div>
        <p class="splash-progress-label">
          Cargando<span class="splash-dots">
            <span>.</span><span>.</span><span>.</span>
          </span>
        </p>
      </div>
    </div>
    <!-- ── Fin Splash ── -->

    <!-- Angular app -->
    <app-root></app-root>

    <!-- Ionicons -->
    <script
      type="module"
      src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"
    ></script>
    <script
      nomodule
      src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"
    ></script>

    <!-- Partículas del splash (JS puro, sin dependencias) -->
    <script>
      (function () {
        var colors = ["#196774", "#EF6024", "#c08c4a", "#90A19D", "#d95c00"];
        var container = document.getElementById("splash-particles");
        for (var i = 0; i < 22; i++) {
          var p = document.createElement("div");
          p.className = "splash-particle";
          var size = Math.random() * 4 + 2;
          p.style.cssText =
            "width:" +
            size +
            "px;" +
            "height:" +
            size +
            "px;" +
            "left:" +
            Math.random() * 100 +
            "vw;" +
            "top:" +
            (80 + Math.random() * 20) +
            "vh;" +
            "background:" +
            colors[Math.floor(Math.random() * colors.length)] +
            ";" +
            "animation-duration:" +
            (5 + Math.random() * 6) +
            "s;" +
            "animation-delay:" +
            Math.random() * 4 +
            "s;";
          container.appendChild(p);
        }
      })();
    </script>
  </body>
</html>
